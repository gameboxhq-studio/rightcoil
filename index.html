<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>右旋壳</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #1A120B;
      color: #E9D8A6;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    #wrap {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100%; gap: 8px; padding: 10px;
    }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.08em; color: #F4A261; }
    #hint { font-size: 12px; color: #8a7a68; text-align: center; line-height: 1.45; max-width: 360px; }
    #game-container {
      border: 2px solid #3D2914;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.55);
      background: #1A120B;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <h1>右旋壳</h1>
    <div id="hint">点空地放/撤石头 · 蜗牛撞墙永远右转 · 吃光叶子</div>
    <div id="game-container"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
